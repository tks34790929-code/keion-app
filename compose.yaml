# ローカル開発用の Docker Compose 設定
# 起動: docker compose up --build
# 値は .env から読み込む（.env.example をコピーして作る）

services:
  # ===== DB（MySQL） =====
  db:
    image: mysql:8.4
    environment:
      TZ: Asia/Tokyo
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      # DB のデータを名前付きボリュームに保存する（コンテナを作り直しても消えない）
      - db-data:/var/lib/mysql
      # 初回起動時に実行するスクリプト（テスト用データベースを作る）。ro: 読み取り専用
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP で応答があれば起動完了とみなす（初期化中の一時サーバーには TCP で接続できないため）
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ===== バックエンド（FastAPI） =====
  backend:
    build: ./backend
    environment:
      TZ: Asia/Tokyo
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # テスト（pytest）で使うデータベース。db/init/01-create-test-db.sh で作る
      TEST_DB_NAME: ${MYSQL_DATABASE}_test
      # Windows のフォルダをマウントすると変更を検知できないことがあるため、ポーリングで検知する
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ===== フロントエンド（Vite + TypeScript） =====
  frontend:
    build: ./frontend
    environment:
      TZ: Asia/Tokyo
    volumes:
      - ./frontend:/app
      # node_modules はコンテナ内だけに置く（PC 側の frontend/ に作らない）
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db-data:
