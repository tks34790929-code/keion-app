# Alembic（マイグレーション）の設定
# 実行例: docker compose exec backend alembic upgrade head

[alembic]
# マイグレーションファイルの置き場所（%(here)s はこのファイルがあるフォルダ）
script_location = %(here)s/alembic
# app パッケージを import できるようにする
prepend_sys_path = %(here)s
# 接続先は alembic/env.py で app/db.py から読み込む（パスワードをここに書かないため）

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
